[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
name = "yt-pockettube"
version = "0.6.1"
description = "Standalone PocketTube organization catalog for YT Library integration"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
yt-pockettube = "yt_pockettube.cli:main"

[project.entry-points."yt_library.plugins"]
pockettube = "yt_pockettube.plugin:create_plugin"

[tool.setuptools]
packages = ["yt_pockettube"]

[tool.setuptools.package-data]
yt_pockettube = ["schema.sql"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
